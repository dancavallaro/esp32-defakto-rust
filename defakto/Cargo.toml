[package]
name = "defakto"
version = "0.1.0"
edition = "2021"

[features]
# Exposes `defakto::testing` so dependent crates can reuse the fakes in their tests.
testing = []

[dependencies]
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
prost = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
