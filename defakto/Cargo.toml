[package]
name = "defakto"
version = "0.1.0"
edition = "2021"

[features]
# Exposes `defakto::testing` so dependent crates can reuse the fakes in their tests.
testing = []
# JWT-SVID verification (`verify`), which brings in RSA.
verify = ["dep:rsa"]

[dependencies]
esp-attest = { path = "../esp-attest" }
thiserror = "2"
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
prost = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
rsa = { version = "0.9", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
