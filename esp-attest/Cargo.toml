[package]
name = "esp-attest"
version = "0.1.0"
edition = "2021"
publish = false

[features]
verify = ["dep:p256", "serde_json/raw_value"]
# Exposes `esp_attest::testing` so dependent crates can build self-signed TEE tokens in their tests.
testing = ["verify"]

[dependencies]
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa"], optional = true }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
serde_json = { version = "1", features = ["raw_value"] }
