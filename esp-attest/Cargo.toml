[package]
name = "esp-attest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
serde_json = { version = "1", features = ["raw_value"] }
