[package]
name = "esp32-attestor"
version = "0.4.0"
edition = "2021"
publish = false
description = "An ESP32 extension attestor for Defakto"

[dependencies]
esp-attest = { path = "../esp-attest", features = ["verify"] }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
